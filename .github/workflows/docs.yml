name: docs

on:
  push:
    branches: [master]
    paths: [docs/**, docs/.includes/**, reports/**/summary.md, zensical.toml, scripts/docs_links.py, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, docs/.includes/**, reports/**/summary.md, zensical.toml, scripts/docs_links.py, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv run --no-project --with zensical==0.0.65 python -m zensical build --clean
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
